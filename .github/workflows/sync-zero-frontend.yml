name: Sync Zero frontend

on:
  push:
    paths:
      - '.github/workflows/sync-zero-frontend.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pages repo
        uses: actions/checkout@v4

      - name: Download Zero frontend assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p zero/static
          base="https://raw.githubusercontent.com/thecoinjob/zero/main/app/static"
          for file in \
            index.html \
            styles.css \
            app.js \
            browser-board.js \
            control-alerts.js \
            directional-participation.js \
            hints-toggle.js \
            interaction-hold.js \
            market-ranking.js \
            landing.html \
            landing.css \
            dashboard-preview.webp
          do
            curl -fsSL "$base/$file" -o "zero/static/$file"
          done

      - name: Commit synced assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zero/static
          if git diff --cached --quiet; then
            echo "No frontend changes to commit."
            exit 0
          fi
          git commit -m "Sync Zero frontend assets"
          git push
